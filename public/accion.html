<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Ahorros — Acción</title>
  <link rel="stylesheet" href="estilos.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">$</div>
        <div class="brand-text">
          <div class="eyebrow">TechSoft S.A. · Prototipo</div>
          <h1>Sistema de Ahorros</h1>
        </div>
      </div>
      <div class="header-actions">
        <div class="status-pill"><span class="status-dot" id="statusDot"></span> <span id="statusText">verificando…</span></div>
        <button class="theme-toggle" onclick="toggleTheme()">
          <span class="icon" id="themeIcon">◐</span>
        </button>
      </div>
    </div>
  </div>

  <div class="secondary-nav">
    <div class="secondary-nav-inner">
      <a href="#" id="backBtn" class="nav-back">‹ Volver</a>
      <span class="nav-separator">—</span>
      <div class="nav-title" id="actionTitle">Depositar</div>
      <div class="nav-chip">PASO 1 DE 2</div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <!-- Current balance -->
      <div style="margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--line);">
        <div class="balance-label">Cuenta a usar</div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
          <div>
            <div class="account-name" id="ownerName">—</div>
            <div class="account-id" id="accountId">—</div>
          </div>
          <div style="text-align: right;">
            <div class="balance-label">Saldo actual</div>
            <div class="balance-value"><span>$</span> <span id="currentBalance">0,00</span></div>
          </div>
        </div>
      </div>

      <!-- Amount input -->
      <div class="field">
        <label>Monto</label>
        <input id="amountInput" type="number" placeholder="0" min="0" step="0.01" oninput="updatePreview()">
        <div class="amount-chips">
          <button class="chip" onclick="setAmount(10000)">$10.000</button>
          <button class="chip" onclick="setAmount(50000)">$50.000</button>
          <button class="chip" onclick="setAmount(100000)">$100.000</button>
          <button class="chip" onclick="setAmount(500000)">$500.000</button>
        </div>
      </div>

      <!-- Preview -->
      <div class="summary">
        <div class="summary-row">
          <span class="summary-label">Saldo actual</span>
          <span class="summary-value">$ <span id="previewCurrent">0,00</span></span>
        </div>
        <div class="summary-row">
          <span class="summary-label" id="operationLabel">Depósito</span>
          <span class="summary-value" id="operationValue">$ 0,00</span>
        </div>
        <div class="summary-row">
          <span>Saldo final</span>
          <span class="summary-value">$ <span id="previewFinal">0,00</span></span>
        </div>
      </div>

      <!-- Actions -->
      <div style="display: flex; gap: 12px; margin-top: 32px;">
        <button id="nextBtn" class="btn-primary" onclick="goToConfirmation()">Siguiente</button>
        <a id="cancelBtn" class="btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Cancelar</a>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    const accountId = getParam('cuenta');
    const actionType = getParam('tipo');
    let currentAccount = null;

    async function init() {
      if (!accountId || !['deposito', 'retiro'].includes(actionType)) {
        window.location.href = 'index.html';
        return;
      }

      // Set up UI based on action type
      const isDeposit = actionType === 'deposito';
      document.getElementById('actionTitle').textContent = isDeposit ? 'Depositar' : 'Retirar';
      document.getElementById('operationLabel').textContent = isDeposit ? 'Depósito' : 'Retiro';
      document.getElementById('backBtn').href = `gestion.html?cuenta=${accountId}`;
      document.getElementById('cancelBtn').href = `gestion.html?cuenta=${accountId}`;

      checkHealth();
      await loadAccount();
      setInterval(checkHealth, 30000);
    }

    async function loadAccount() {
      const account = await getAccount(accountId);
      if (!account) {
        window.location.href = 'index.html';
        return;
      }

      currentAccount = account;
      document.getElementById('ownerName').textContent = account.owner;
      document.getElementById('accountId').textContent = '#' + String(account.id).padStart(3, '0');
      document.getElementById('currentBalance').textContent = formatCOP(account.balance);
      updatePreview();
    }

    function setAmount(amount) {
      document.getElementById('amountInput').value = amount;
      updatePreview();
    }

    function updatePreview() {
      if (!currentAccount) return;

      const amount = parseAmount(document.getElementById('amountInput').value);
      const isDeposit = actionType === 'deposito';
      const final = isDeposit ? currentAccount.balance + amount : currentAccount.balance - amount;

      document.getElementById('previewCurrent').textContent = formatCOP(currentAccount.balance);
      document.getElementById('operationValue').textContent = (isDeposit ? '+ ' : '− ') + '$ ' + formatCOP(amount);
      document.getElementById('previewFinal').textContent = formatCOP(Math.max(0, final));

      document.getElementById('nextBtn').disabled = amount <= 0 || (!isDeposit && final < 0);
    }

    function goToConfirmation() {
      const amount = parseAmount(document.getElementById('amountInput').value);
      if (amount <= 0) return;

      // Store in session storage temporarily
      sessionStorage.setItem('pendingAction', JSON.stringify({
        accountId,
        type: actionType,
        amount
      }));

      window.location.href = 'confirmar.html';
    }

    function toggleTheme() {
      const root = document.documentElement;
      const isDark = root.getAttribute('data-theme') === 'dark';
      if (isDark) {
        root.removeAttribute('data-theme');
        document.getElementById('themeIcon').textContent = '◐';
      } else {
        root.setAttribute('data-theme', 'dark');
        document.getElementById('themeIcon').textContent = '◑';
      }
    }

    init();
  </script>
</body>
</html>
