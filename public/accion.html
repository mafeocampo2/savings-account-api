<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Operación — Sistema de Ahorros</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">$</div>
      <div class="brand-text">
        <h1>Sistema de Ahorros</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="status-pill"><span class="status-dot" id="statusDot"></span> <span id="statusText">verificando…</span></div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        <span id="themeLabel">Modo oscuro</span>
      </button>
    </div>
  </div>
</div>

<div class="page">

  <div class="section">
    <div class="section-head">
      <span class="section-num">§1</span>
      <span class="section-title" id="titleText">Operación</span>
    </div>

    <div id="accountSummary">
      <p style="color:var(--ink-soft);">Cargando...</p>
    </div>

    <div class="grid" style="grid-template-columns: 1fr; margin-top:24px;">
      <div class="field">
        <label>Monto</label>
        <input id="amountInput" type="text" inputmode="numeric" placeholder="0">
      </div>
      <div style="display:flex; gap:12px; margin-top:24px;">
        <button class="btn-primary" onclick="goToConfirm()">Siguiente</button>
        <a id="backLink" href="#" class="btn-ghost">Cancelar</a>
      </div>
    </div>

    <div id="notice" class="notice"></div>
  </div>

</div>

<script src="app.js"></script>
<script>
const accountId = getQueryParam('id');
const tipo = getQueryParam('tipo');

async function loadAccount() {
  if (!accountId || !tipo) {
    window.location.href = 'index.html';
    return;
  }

  if (tipo !== 'deposit' && tipo !== 'withdraw') {
    window.location.href = `gestion.html?id=${accountId}`;
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/${accountId}`);
    const json = await res.json();

    if (!res.ok || !json.data) {
      window.location.href = 'index.html';
      return;
    }

    const acc = json.data;
    const isDeposit = tipo === 'deposit';
    const title = isDeposit ? 'Depósito' : 'Retiro';

    document.getElementById('titleText').textContent = title;
    document.getElementById('accountSummary').innerHTML = `
      <div style="display:grid; gap:12px;">
        <div><span style="color:var(--ink-soft); font-size:12px;">Cuenta</span><div style="font-weight:700;">#${acc.id} — ${acc.ownerName}</div></div>
        <div><span style="color:var(--ink-soft); font-size:12px;">Saldo actual</span><div style="font-size:20px; font-weight:700; color:var(--amount);">${money(acc.balance)}</div></div>
      </div>
    `;

    document.getElementById('backLink').href = `gestion.html?id=${accountId}`;
  } catch (e) {
    window.location.href = 'index.html';
  }
}

function goToConfirm() {
  // parseAmount tolera "10.000" y "10.000,50"; guardamos el número ya limpio.
  const amount = parseAmount(document.getElementById('amountInput').value.trim());

  if (amount <= 0) {
    showNotice('notice', 'Ingresa un monto válido.', false);
    return;
  }

  sessionStorage.setItem('operationAmount', String(amount));
  window.location.href = `confirmar.html?id=${accountId}&tipo=${tipo}`;
}

loadAccount();
</script>

</body>
</html>
