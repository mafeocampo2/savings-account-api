<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Ahorros</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">$</div>
      <div class="brand-text">
        <h1>Sistema de Ahorros</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="status-pill"><span class="status-dot" id="statusDot"></span> <span id="statusText">verificando…</span></div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        <span id="themeLabel">Modo oscuro</span>
      </button>
    </div>
  </div>
</div>

<div class="page">

  <div class="section">
    <div class="section-head">
      <span class="section-num">§1</span>
      <span class="section-title">Mis cuentas</span>
    </div>

    <div id="accountsList">
      <p style="color:var(--ink-soft);">Cargando cuentas...</p>
    </div>

    <div style="margin-top:24px;">
      <a href="crear.html" class="btn-primary">+ Crear nueva cuenta</a>
    </div>
  </div>

  <div class="footer-note">fin del registro<span class="dash">—</span>los datos viven en el servidor mientras esté corriendo</div>

</div>

<script src="app.js"></script>
<script>
async function loadAccounts() {
  try {
    const res = await fetch(API_BASE);
    const json = await res.json();
    const accounts = json.data || [];

    const list = document.getElementById('accountsList');
    if (accounts.length === 0) {
      list.innerHTML = '<p style="color:var(--ink-soft); font-style:italic;">Aún no hay cuentas creadas.</p>';
      return;
    }

    list.innerHTML = accounts.map(acc => `
      <div class="card">
        <div>
          <strong class="card-owner">#${acc.id} — ${acc.ownerName}</strong>
          <div class="card-amount">${money(acc.balance)}</div>
        </div>
        <div class="card-side">
          <span class="card-date">${new Date(acc.createdAt).toLocaleDateString('es-CO')}</span>
          <a href="gestion.html?id=${acc.id}" class="btn-primary">Gestionar</a>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('accountsList').innerHTML = '<p style="color:var(--red);">Error cargando cuentas.</p>';
  }
}

loadAccounts();
</script>

</body>
</html>
