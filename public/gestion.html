<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestionar cuenta — Sistema de Ahorros</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">$</div>
      <div class="brand-text">
        <h1>Sistema de Ahorros</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="status-pill"><span class="status-dot" id="statusDot"></span> <span id="statusText">verificando…</span></div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        <span id="themeLabel">Modo oscuro</span>
      </button>
    </div>
  </div>
</div>

<div class="page">

  <div class="section">
    <div class="section-head">
      <span class="section-num">§1</span>
      <span class="section-title">Información de la cuenta</span>
    </div>

    <div id="accountInfo">
      <p style="color:var(--ink-soft);">Cargando...</p>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="section-num">§2</span>
      <span class="section-title">Saldo actual</span>
    </div>

    <div class="balance-row">
      <div>
        <div class="balance-label">Disponible</div>
        <div class="balance-value" id="balanceValue"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="section-num">§3</span>
      <span class="section-title">Operaciones</span>
    </div>

    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <a href="#" id="depositLink" class="btn-primary">Depositar</a>
      <a href="#" id="withdrawLink" class="btn-primary">Retirar</a>
      <button class="btn-danger" onclick="deleteAccount()">Eliminar cuenta</button>
      <a href="index.html" class="btn-ghost">Volver</a>
    </div>
    <div id="deleteNotice" class="notice"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="section-num">§4</span>
      <span class="section-title">Historial</span>
    </div>
    <table>
      <thead>
        <tr><th>Fecha</th><th>Hora</th><th>Movimiento</th><th style="text-align:right;">Monto</th></tr>
      </thead>
      <tbody id="ledgerBody">
        <tr class="empty-row"><td colspan="4">Cargando historial...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer-note">fin del registro<span class="dash">—</span>los datos viven en el servidor mientras esté corriendo</div>

</div>

<script src="app.js"></script>
<script>
const accountId = getQueryParam('id');

async function loadAccount() {
  if (!accountId) {
    window.location.href = 'index.html';
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/${accountId}`);
    const json = await res.json();

    if (!res.ok || !json.data) {
      document.getElementById('accountInfo').innerHTML = '<p style="color:var(--red);">Cuenta no encontrada.</p>';
      return;
    }

    const acc = json.data;
    document.getElementById('accountInfo').innerHTML = `
      <div style="display:grid; grid-template-columns:auto auto; gap:24px; align-items:baseline;">
        <div><span style="color:var(--ink-soft); font-size:12px; text-transform:uppercase; font-weight:600;">Número de cuenta</span><div style="font-size:20px; font-weight:700;">#${acc.id}</div></div>
        <div><span style="color:var(--ink-soft); font-size:12px; text-transform:uppercase; font-weight:600;">Titular</span><div style="font-size:20px; font-weight:700;">${acc.ownerName}</div></div>
        <div><span style="color:var(--ink-soft); font-size:12px; text-transform:uppercase; font-weight:600;">Fecha de apertura</span><div style="font-size:14px;">${new Date(acc.createdAt).toLocaleDateString('es-CO')}</div></div>
      </div>
    `;

    document.getElementById('balanceValue').innerHTML = money(acc.balance);

    document.getElementById('depositLink').href = `accion.html?id=${accountId}&tipo=deposit`;
    document.getElementById('withdrawLink').href = `accion.html?id=${accountId}&tipo=withdraw`;

    loadHistory();
  } catch (e) {
    document.getElementById('accountInfo').innerHTML = '<p style="color:var(--red);">Error cargando cuenta.</p>';
  }
}

async function loadHistory() {
  try {
    const res = await fetch(`${API_BASE}/${accountId}/history`);
    const json = await res.json();

    if (!res.ok || !json.data) {
      document.getElementById('ledgerBody').innerHTML = '<tr class="empty-row"><td colspan="4">Sin historial.</td></tr>';
      return;
    }

    const transactions = json.data.transactions || [];
    if (transactions.length === 0) {
      document.getElementById('ledgerBody').innerHTML = '<tr class="empty-row"><td colspan="4">Sin historial.</td></tr>';
      return;
    }

    const body = document.getElementById('ledgerBody');
    body.innerHTML = transactions.reverse().map(tx => {
      const date = new Date(tx.timestamp);
      const dateStr = date.toLocaleDateString('es-CO');
      const timeStr = fmtTime(date);
      let sign = '';
      let className = 'neu';
      if (tx.type === 'deposit') { sign = '+ '; className = 'pos'; }
      else if (tx.type === 'withdraw') { sign = '− '; className = 'neg'; }

      return `<tr>
        <td>${dateStr}</td>
        <td>${timeStr}</td>
        <td>${tx.description}</td>
        <td class="t-amt ${className}">${sign}${money(Math.abs(tx.amount))}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    document.getElementById('ledgerBody').innerHTML = '<tr class="empty-row"><td colspan="4">Error cargando historial.</td></tr>';
  }
}

async function deleteAccount() {
  if (!confirm('¿Estás seguro de que deseas eliminar esta cuenta?')) return;

  try {
    const res = await fetch(`${API_BASE}/${accountId}`, { method: 'DELETE' });
    const json = await res.json();

    if (!res.ok || !json.success) {
      showNotice('deleteNotice', json.message || 'Error eliminando cuenta.', false);
      return;
    }

    showNotice('deleteNotice', 'Cuenta eliminada.', true);
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1500);
  } catch (e) {
    showNotice('deleteNotice', 'Error conectando con el servidor.', false);
  }
}

loadAccount();
</script>

</body>
</html>
