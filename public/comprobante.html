<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Comprobante — Sistema de Ahorros</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">$</div>
      <div class="brand-text">
        <h1>Sistema de Ahorros</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="status-pill"><span class="status-dot" id="statusDot"></span> <span id="statusText">verificando…</span></div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        <span id="themeLabel">Modo oscuro</span>
      </button>
    </div>
  </div>
</div>

<div class="page">

  <div class="section" style="background:var(--green-bg); border:2px solid var(--green);">
    <div style="text-align:center; padding:24px 0;">
      <div style="font-size:24px; font-weight:700; color:var(--green); margin-bottom:8px;">Operación aprobada</div>
      <div style="font-size:14px; color:var(--ink-soft);" id="opTypeText"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="section-num">§3</span>
      <span class="section-title">Comprobante de operación</span>
    </div>

    <div style="background:var(--paper); padding:24px; border-radius:8px; border:2px dashed var(--line); margin-bottom:24px;">
      <div style="display:grid; gap:16px; text-align:center;">
        <div>
          <span style="color:var(--ink-soft); font-size:11px; text-transform:uppercase;">Fecha y hora</span>
          <div style="font-size:14px; font-weight:600;" id="dateTime"></div>
        </div>

        <div style="border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:16px 0;">
          <div>
            <span style="color:var(--ink-soft); font-size:11px; text-transform:uppercase;">Monto movido</span>
            <div style="font-size:32px; font-weight:800; color:var(--amount);" id="amount"></div>
          </div>
        </div>

        <div>
          <span style="color:var(--ink-soft); font-size:11px; text-transform:uppercase;">Nuevo saldo</span>
          <div style="font-size:20px; font-weight:700; color:var(--green);" id="newBalance"></div>
        </div>

        <div style="border-top:1px solid var(--line); padding-top:16px;">
          <span style="color:var(--ink-soft); font-size:11px; text-transform:uppercase;">Número de referencia</span>
          <div style="font-size:12px; font-family:monospace; font-weight:600;" id="refNumber"></div>
        </div>
      </div>
    </div>

    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <a href="#" id="gestionLink" class="btn-primary">Volver a gestión</a>
      <a href="index.html" class="btn-ghost">Inicio</a>
    </div>
  </div>

  <div class="footer-note">fin del registro<span class="dash">—</span>los datos viven en el servidor mientras esté corriendo</div>

</div>

<script src="app.js"></script>
<script>
const accountId = getQueryParam('id');
const result = JSON.parse(sessionStorage.getItem('operationResult') || '{}');

if (!accountId || !result.operation) {
  window.location.href = 'index.html';
}

const isDeposit = result.operation === 'deposit';
document.getElementById('opTypeText').textContent = isDeposit ? 'Depósito completado' : 'Retiro completado';
document.getElementById('amount').innerHTML = money(result.amount);
document.getElementById('newBalance').innerHTML = money(result.newBalance);

const now = new Date();
document.getElementById('dateTime').textContent = fmtDateTime(now);

const refNum = `REF-${accountId}-${Date.now()}`;
document.getElementById('refNumber').textContent = refNum;

document.getElementById('gestionLink').href = `gestion.html?id=${accountId}`;

sessionStorage.removeItem('operationAmount');
sessionStorage.removeItem('operationResult');
</script>

</body>
</html>
